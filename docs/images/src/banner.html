<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* layout: the name set large on cool paper, a small brass-banded hat beside it, one ledger rule under the tagline */
  :root { --paper: #F5F7FA; --ink: #14202E; --ink-soft: #4A5A6C; --brass: #B8893B; --rule: #D5DCE4;
          --serif: "Newsreader", Georgia, serif; --mono: "JetBrains Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 400px; }
  body { background: var(--paper); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 56px; }
  svg { flex: none; }
  .name { font: 600 132px/0.95 var(--serif); letter-spacing: -0.02em; }
  .tag { font: 500 34px/1.3 var(--serif); color: var(--ink-soft); margin-top: 18px; }
  .rule { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--rule); font: 400 19px var(--mono); color: var(--ink-soft); }
  .rule span { color: var(--brass); }
</style>
</head>
<body>
  <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true">

  <div>
    <div class="name">Alfred</div>

    <div class="rule">a workflow plugin for Claude Code and Codex: <span>trace</span>, <span>log</span>, <span>decision</span></div>
  </div>
</body>
